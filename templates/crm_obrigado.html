<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recebemos seu contato</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Lexend', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0c; color: #f0f0f5;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .card {
      background: #16161a; border: 1px solid #2d2d30; border-radius: 16px;
      padding: 40px 32px; max-width: 420px;
    }
    .icone { font-size: 46px; margin-bottom: 14px; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 10px; }
    p { font-size: 14px; color: #a0a0b0; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icone">✅</div>
    <h1>Recebemos seu contato!</h1>
    <p>Em instantes nossa equipe vai te chamar no WhatsApp.<br>
       Fique de olho no celular.</p>
  </div>
</body>
</html>
