# =============================================================
# nginx — cadastro.tráfego.com  (punycode: cadastro.xn--trfego-qta.com)
# Subdomínio de captura de leads. Serve a LP do CRM e só ela:
# o Flask responde 404 para /crm, /login e afins neste host.
#
# Instalar na VPS:
#   sudo cp /var/www/optimizer/deploy/nginx/cadastro.conf \
#           /etc/nginx/sites-available/cadastro.conf
#   sudo ln -sf /etc/nginx/sites-available/cadastro.conf \
#               /etc/nginx/sites-enabled/cadastro.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Só DEPOIS rodar o certbot (ver README.md desta pasta) — ele reescreve
# este arquivo acrescentando as linhas de ssl_certificate.
# =============================================================

server {
    listen 80;
    listen [::]:80;
    server_name cadastro.xn--trfego-qta.com;

    # Deixa o ACME do Let's Encrypt passar antes de qualquer redirect
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cadastro.xn--trfego-qta.com;

    # O certbot insere ssl_certificate / ssl_certificate_key aqui.

    access_log /var/log/nginx/cadastro.access.log;
    error_log  /var/log/nginx/cadastro.error.log;

    location / {
        proxy_pass http://127.0.0.1:5000;

        # Host: o Flask decide pelo host se serve a LP na raiz (LP_HOSTS em
        # modules/crm.py). Sem esta linha o app recebe '127.0.0.1' e o
        # subdomínio não funciona.
        proxy_set_header Host              $host;
        # X-Forwarded-For alimenta o rate limit por IP da captura
        # (modules/rate_limiter._client_ip); sem ele todo lead vira o mesmo IP
        # e o limite de 1/min derruba leads legítimos de visitantes diferentes.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_read_timeout    60s;
    }

    # A LP é um formulário pequeno; não há upload por aqui.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json;
}
